%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/nuvoton,ma35d1-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 Series UART Controller

description: |
  This describes the devicetree bindings for the UART controller found
  in Nuvoton MA35D1, MA35H0, and MA35D0 SoCs.

maintainers:
  - Nuvoton Technology Corporation <www.nuvoton.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-uart
      - nuvoton,ma35h0-uart
      - nuvoton,ma35d0-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  ma35d1-console:
    description: |
      Indicates that this UART instance is used as the system console.
    type: boolean

  port-number:
    description: |
      The port number assigned to this UART instance.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 16

  pdma-enable:
    description: |
      Indicates whether PDMA (Peripheral DMA) is enabled for this UART
      instance. 0 means disabled, 1 means enabled.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  dmas:
    minItems: 1
    maxItems: 2

  dma-names:
    minItems: 1
    maxItems: 2
    items:
      enum:
        - tx
        - rx

  wakeup-enable:
    description: |
      Enables specific wakeup sources while the UART is in low-power
      mode: <cts-wakeup fifo-threshold-wakeup fifo-timeout-wakeup>.
      Each cell is 0 (disabled) or 1 (enabled).
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    items:
      enum: [0, 1]

  fifo-threshold:
    description: |
      FIFO threshold value used only when fifo-threshold-wakeup is
      enabled in wakeup-enable. Valid values are 1, 4, 8, 14, or 30
      bytes.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 4, 8, 14, 30]

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - port-number

dependencies:
  dmas: [dma-names]
  dma-names: [dmas]

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    serial@40700000 {
        compatible = "nuvoton,ma35d1-uart";
        reg = <0x0 0x40700000 0x0 0x10000>;
        ma35d1-console;
        interrupts = <GIC_SPI 59 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk UART0_GATE>;
        port-number = <0>;
        pdma-enable = <0>;
        status = "okay";
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    serial@40710000 {
        compatible = "nuvoton,ma35d1-uart";
        reg = <0x0 0x40710000 0x0 0x10000>;
        interrupts = <GIC_SPI 60 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk UART1_GATE>;
        port-number = <1>;
        dmas = <&pdma2 2>, <&pdma3 3>;
        dma-names = "tx", "rx";
        pdma-enable = <0>;
        status = "disabled";
    };