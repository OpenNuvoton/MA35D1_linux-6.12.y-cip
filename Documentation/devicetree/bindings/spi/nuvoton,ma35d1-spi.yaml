%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/nuvoton,ma35d1-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 SPI Controller

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description: |
  The Nuvoton MA35D1 contains four SPI controllers. Each controller supports
  full-duplex transfers, two native chip-select signals, 8- to 32-bit words,
  programmable clock polarity and phase, and optional PDMA transfers.

  This binding describes the controller operating in SPI master mode. The I2S
  function provided by the same hardware block is handled by a separate audio
  driver and binding.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-spi
      - nuvoton,ma35d1-spi
      - nuvoton,ma35h0-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  dmas:
    minItems: 2
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  nuvoton,pdma-reqsel-tx:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description:
      MA35D1 PDMA request selector used for SPI transmit requests.

  nuvoton,pdma-reqsel-rx:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description:
      MA35D1 PDMA request selector used for SPI receive requests.

  num-cs:
    const: 2
    default: 2

  cs-gpios: false

  spi-slave: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - "#address-cells"
  - "#size-cells"

dependencies:
  dmas:
    - dma-names
    - nuvoton,pdma-reqsel-tx
    - nuvoton,pdma-reqsel-rx
  dma-names:
    - dmas
  nuvoton,pdma-reqsel-tx:
    - dmas
  nuvoton,pdma-reqsel-rx:
    - dmas

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    spi@40600000 {
        compatible = "nuvoton,ma35d1-spi";
        reg = <0x0 0x40600000 0x0 0x10000>;
        interrupts = <GIC_SPI 89 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk SPI0_GATE>;

        dmas = <&pdma1 4>, <&pdma1 5>;
        dma-names = "tx", "rx";
        nuvoton,pdma-reqsel-tx = <60>;
        nuvoton,pdma-reqsel-rx = <61>;

        num-cs = <2>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
...
