%YAML 1.2
---
$id: "http://devicetree.org/schemas/media/nuvoton,ma35d1-ccap.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton MA35D1 Camera Capture Interface Controller (CCAP)

maintainers:
  - Your Name <your@email.com>

description: |
  The Camera Capture Interface Controller (CCAP) captures image data from
  a sensor, processes the image stream, and uses an embedded DMA engine to
  move data from internal FIFO to system memory through the AHB bus.

properties:
  compatible:
    const: nuvoton,ma35d1-ccap
    const: nuvoton,ma35d0-ccap
    const: nuvoton,ma35h0-ccap

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: core

  clock-frequency:
    description: Input sensor clock frequency in Hz.
    minimum: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Video input endpoint description.

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    ccap0: ccap@40240000 {
      compatible = "nuvoton,ma35d1-ccap";
      reg = <0x0 0x40240000 0x0 0x2000>;
      interrupts = <GIC_SPI 21 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clk ccap0_gate>;
      clock-names = "core";
      clock-frequency = <12000000>;
      status = "okay";

      port {
        #address-cells = <1>;
        #size-cells = <0>;

        ccap0_1: endpoint {
          remote-endpoint = <&nt99141_0>;
          bus-type = <5>;
          bus-width = <8>;
          hsync-active = <0>;
          vsync-active = <0>;
          pclk-sample = <1>;
        };
      };
    };

    i2c_gpio@0 {
      compatible = "i2c-gpio";
      gpios = <&gpio 3 0>,
              <&gpio 4 0>;
      i2c-gpio,sda-open-drain;
      i2c-gpio,scl-open-drain;
      i2c-gpio,delay-us = <2>;
      #address-cells = <1>;
      #size-cells = <0>;
      status = "okay";

      nt99141@2a {
        compatible = "nuvoton,nt99141";
        reg = <0x2a>;

        port {
          nt99141_0: endpoint {
            remote-endpoint = <&ccap0_1>;
          };
        };
      };
    };

    ccap1: ccap@40250000 {
      compatible = "nuvoton,ma35d1-ccap";
      reg = <0x0 0x40250000 0x0 0x2000>;
      interrupts = <GIC_SPI 22 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clk ccap1_gate>;
      clock-names = "core";
      status = "okay";
    };
...
